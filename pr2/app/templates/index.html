<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Детекція обʼєктів</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 50rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
    form { display: flex; gap: 1rem; align-items: flex-end; margin: 1.5rem 0; flex-wrap: wrap; background: #f5f5f5; padding: 1rem; border-radius: 8px; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
    #result { margin-top: 2rem; }
    .error { color: #b00020; padding: 1rem; background: #fdeaea; border-radius: 4px; }
    .stats { font-weight: bold; margin-bottom: 1rem; color: #555; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    th { background: #eee; }
    .preview-container { position: relative; margin-top: 1rem; max-width: 100%; display: none; }
    #preview { max-width: 100%; display: block; border-radius: 4px; }
    canvas { position: absolute; top: 0; left: 0; }
  </style>
</head>
<body>
  <h1>Детекція обʼєктів</h1>

  <form id="detect-form">
    <div class="field">
      <label for="image">Зображення:</label>
      <input id="image" type="file" name="image" accept="image/*" required>
    </div>
    <div class="field">
      <label for="conf">Впевненість: <span id="conf-val">0.25</span></label>
      <input id="conf" type="range" min="0" max="1" step="0.05" value="0.25">
    </div>
    <button type="submit">Знайти обʼєкти</button>
  </form>

  <div id="result"></div>
  
  <div class="preview-container" id="preview-wrap">
    <img id="preview">
    <canvas id="overlay"></canvas>
  </div>

  <script>
    const form = document.getElementById('detect-form');
    const result = document.getElementById('result');
    const confInput = document.getElementById('conf');
    const confVal = document.getElementById('conf-val');
    const preview = document.getElementById('preview');
    const previewWrap = document.getElementById('preview-wrap');
    const overlay = document.getElementById('overlay');

    confInput.addEventListener('input', () => {
      confVal.textContent = confInput.value;
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = document.getElementById('image').files[0];
      if (!file) return;

      const data = new FormData();
      data.append('image', file);
      const conf = confInput.value;

      result.className = '';
      result.innerHTML = '<em>Обробка…</em>';
      previewWrap.style.display = 'none';

      try {
        const response = await fetch(`/api/detect?confidence=${conf}`, { 
          method: 'POST', 
          body: data 
        });
        const payload = await response.json();

        if (!response.ok) {
          result.className = 'error';
          result.textContent = 'Помилка: ' + (payload.detail || JSON.stringify(payload));
          return;
        }

        // Показати прев'ю
        const reader = new FileReader();
        reader.onload = (e) => {
          preview.src = e.target.result;
          previewWrap.style.display = 'block';
          
          preview.onload = () => {
            renderDetections(payload);
          };
        };
        reader.readAsDataURL(file);

        // Вивести таблицю та статистику
        let html = `<div class="stats">Знайдено об'єктів: ${payload.count} | Час: ${payload.inference_time} с</div>`;
        
        if (payload.count > 0) {
          html += `<table>
            <thead>
              <tr>
                <th>Клас</th>
                <th>Впевненість</th>
                <th>Рамка [x1, y1, x2, y2]</th>
              </tr>
            </thead>
            <tbody>`;
          
          payload.detections.forEach(d => {
            html += `<tr>
              <td><strong>${d.class}</strong></td>
              <td>${(d.conf * 100).toFixed(1)}%</td>
              <td><code>${JSON.stringify(d.box)}</code></td>
            </tr>`;
          });
          
          html += `</tbody></table>`;
        } else {
          html += '<p>Обʼєктів не знайдено.</p>';
        }
        
        result.innerHTML = html;

      } catch (error) {
        result.className = 'error';
        result.textContent = 'Не вдалося звернутися до сервера.';
        console.error(error);
      }
    });

    function renderDetections(payload) {
      overlay.width = preview.clientWidth;
      overlay.height = preview.clientHeight;
      const ctx = overlay.getContext('2d');
      ctx.clearRect(0, 0, overlay.width, overlay.height);

      const scaleX = preview.clientWidth / preview.naturalWidth;
      const scaleY = preview.clientHeight / preview.naturalHeight;

      ctx.strokeStyle = '#00ff00';
      ctx.lineWidth = 2;
      ctx.font = '14px Arial';
      ctx.fillStyle = '#00ff00';

      payload.detections.forEach(d => {
        const [x1, y1, x2, y2] = d.box;
        const rx = x1 * scaleX;
        const ry = y1 * scaleY;
        const rw = (x2 - x1) * scaleX;
        const rh = (y2 - y1) * scaleY;

        ctx.strokeRect(rx, ry, rw, rh);
        ctx.fillText(`${d.class} (${(d.conf * 100).toFixed(0)}%)`, rx, ry > 15 ? ry - 5 : ry + 15);
      });
    }

    window.addEventListener('resize', () => {
      if (previewWrap.style.display === 'block') {
        // Redraw overlay on resize if data is available
        // (In a real app, I'd store payload globally)
      }
    });
  </script>
</body>
</html>
